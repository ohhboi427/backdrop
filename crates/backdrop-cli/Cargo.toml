[package]
name = "backdrop-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
unsplash-rs = { path = "../unsplash-rs" }
anyhow = "1.0"
form_urlencoded = "1.2"
keyring = { version = "4.2", features = ["apple-native-keyring-store", "windows-native-keyring-store", "dbus-secret-service-keyring-store"] }
open = "5.4"
thiserror = "2.0"
tokio = { version = "1.53", features = ["full"] }
url = { version = "2.5", features = ["serde"] }
