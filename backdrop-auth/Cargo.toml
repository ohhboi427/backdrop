[package]
name = "backdrop-auth"
version = "0.1.0"
edition = "2024"

[dependencies]
unsplash-api = { path = "../unsplash-api" }
anyhow = "1.0.100"
axum = "0.8.6"
dotenvy = "0.15.7"
http = "1.3.1"
reqwest = { version = "0.12.24", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
url = "2.5.7"
uuid = { version = "1.18.1", features = ["serde", "v4"] }
